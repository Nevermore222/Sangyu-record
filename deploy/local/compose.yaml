name: sangyu-record

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sangyu
      POSTGRES_USER: sangyu
      POSTGRES_PASSWORD: sangyu
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sangyu -d sangyu"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sangyu
      MINIO_ROOT_PASSWORD: sangyu-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 sangyu sangyu-local-secret &&
        mc mb --ignore-existing local/sangyu-private &&
        mc anonymous set none local/sangyu-private

  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.api
    environment: &app-environment
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://sangyu:sangyu@postgres:5432/sangyu?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      S3_ACCESS_KEY: sangyu
      S3_SECRET_KEY: sangyu-local-secret
      S3_BUCKET: sangyu-private
      S3_REGION: us-east-1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.worker
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  minio-data:
